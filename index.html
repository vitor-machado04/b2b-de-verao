<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-title" content="B2B de Verão">
<title>B2B de Verão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E8F4FC'/%3E%3Cg stroke='%231783C4' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M8 14v4M13 9v14M19 12v8M24 7v18'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: página branca e arejada, uma coluna de celular. O topo tem a luz de um amanhecer de pista aberta;
   a faixa de dias é um equalizador (barra mais alta = dia de festa). Um tema só, claro, de propósito. */
:root{
  --bg:#FFFFFF; --surface:#F5F8FA; --surface-2:#E9EFF3; --ink:#2A3542; --ink-2:#6B7885; --line:#E3E9EE;
  --sea:#1783C4; --sea-light:#9AD1F0; --sea-soft:#E8F4FC; --on-sea:#FFFFFF;
  --sun:#F28B5B; --sun-ink:#B5532A; --sun-soft:#FFF1E9; --pink:#F4A6C0; --heart:#D9487A;
  --ok:#23805A; --ok-soft:#E8F6EF; --bolt:#FFD76A;
  --grey:#97A3AE; --grey-soft:#EFF2F5; --scrim:rgba(42,53,66,.35); --veil:rgba(255,255,255,.86);
  --dawn:linear-gradient(120deg,#FFEDE2 0%,#FDEAF2 48%,#E6F3FC 100%);
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
:focus-visible{outline:3px solid var(--sea-light);outline-offset:2px;border-radius:6px}
.mono{font-size:.8rem;font-weight:500;color:var(--ink-2)}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:14px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:500;font-size:.8rem;color:var(--ink-2)}
.who{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.banner{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-size:.9rem}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
.vh{display:grid;gap:8px}
.vh h2{font-size:1.3rem}
.vh p{color:var(--ink-2);max-width:60ch}

/* botões e chips */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--sea);color:var(--on-sea);border-radius:999px;padding:10px 16px;font-weight:700;font-size:.92rem;min-height:42px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.danger{color:var(--heart)}
.btn.dashed{background:var(--sea-soft);color:var(--sea);width:100%;justify-content:center}
.add{border:0;background:transparent;color:var(--sea);font-weight:600;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;justify-self:start;min-height:40px;padding:0;margin-left:74px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--sea-soft);color:var(--sea);border-color:var(--sea-soft)}

/* topo e cartão de embarque */
.hero{display:grid;gap:14px;background:var(--dawn);border-radius:24px;padding:20px 16px 16px}
.hero h1{font-size:clamp(1.7rem,8.2vw,2.5rem);font-weight:300}
.hero h1 em{font-style:normal;font-weight:500;color:var(--sea)}
.pass{background:var(--bg);border-radius:18px;border:1px solid var(--line)}
.hero .pass{border-color:transparent}
.pass-main{padding:16px 16px 14px;display:grid;gap:14px}
.pass-route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.code b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.8rem;line-height:1.1}
.code span{font-size:.8rem;color:var(--ink-2)}
.code.r{text-align:right}
.fly{display:flex;align-items:center;gap:6px;color:var(--sea);min-width:0}
.fly i{flex:1;border-top:1.5px dashed var(--line);min-width:8px}
.fly .ic{width:1.4rem;height:1.4rem}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fields div{display:grid;gap:2px;min-width:0}
.fields b{font-family:var(--f-mono);font-weight:500;font-size:.86rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pass-stub{border-top:1.5px dashed var(--line);padding:14px 16px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.cd-big{font-family:var(--f-display);font-weight:300;font-size:2.6rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums}
.cd-unit{font-family:var(--f-display);font-weight:500;font-size:.95rem}
.cd-rest{font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cd-cap{flex-basis:100%;font-size:.9rem;color:var(--ink-2)}
.pass.sad{background:var(--grey-soft);border-color:transparent}
.pass.sad .fly{color:var(--grey)}

/* faixa de dias: equalizador */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0 6px;display:grid;grid-template-columns:repeat(15,minmax(0,1fr))}
.dchip{border:0;background:transparent;padding:0;height:74px;display:grid;justify-items:center;align-content:end;gap:2px;min-width:0}
.dchip .bar{width:8px;border-radius:4px;background:var(--sea-light)}
.dchip .bar.hot{background:linear-gradient(var(--pink),var(--sun))}
.dchip b{font-family:var(--f-mono);font-weight:500;font-size:.78rem;line-height:1.1}
.dchip span{font-size:.56rem;color:var(--ink-2);line-height:1}
.dchip u{width:4px;height:4px;border-radius:50%;background:transparent}
.dchip u.m-open{background:var(--sun)}
.dchip.today b{color:var(--sea);font-weight:500;box-shadow:0 2px 0 var(--sea)}
.dchip.gone .bar{background:var(--grey)}
.dchip.gone b{color:var(--grey)}
@media (hover:hover){.dchip:hover .bar{filter:brightness(.92)}}

/* dia */
.day{display:grid;gap:12px;scroll-margin-top:calc(100px + env(safe-area-inset-top,0px));padding-top:16px;border-top:1px solid var(--line)}
.day-h{display:flex;gap:12px;align-items:center}
.dnum{font-family:var(--f-display);font-weight:300;font-size:2.3rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums}
.day-h h2{font-size:1rem;text-transform:lowercase}
.day.today .dnum{color:var(--sun)}
.sleep{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.sleep.open{color:var(--sun-ink);font-weight:600}
.tl{list-style:none;padding:0;display:grid;gap:10px;position:relative}
.tl::before{content:"";position:absolute;left:61px;top:8px;bottom:8px;border-left:1.5px solid var(--line)}
.tl>li{display:grid;grid-template-columns:52px 20px minmax(0,1fr);align-items:start}
.when{font-family:var(--f-mono);font-size:.76rem;text-align:right;padding-top:4px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--grey);margin:7px auto 0;position:relative;z-index:1}
.k-flight .dot,.k-drive .dot{border-color:var(--sea);background:var(--sea)}
.k-show .dot{border-color:var(--pink);background:var(--pink)}
.k-idea .dot{border-color:var(--sun)}
.ent{display:grid;gap:2px;padding:2px 0 2px 6px;min-width:0;text-align:left}
.ent b{font-weight:700}
.ent span{font-size:.88rem;color:var(--ink-2)}
.ent .lnk{font-size:.88rem;font-weight:600}
button.ent{border:0;background:var(--surface);border-radius:12px;padding:10px 12px;margin-left:6px;width:calc(100% - 6px)}
.match{color:var(--heart)!important;font-weight:700}
.callout{border-radius:16px;padding:14px;display:grid;gap:6px;background:var(--sun-soft)}
.callout .mono{color:var(--sun-ink)}
.callout b{font-size:1.02rem;line-height:1.25}
.callout p{font-size:.92rem}
.callout.done{background:var(--ok-soft)}
.callout.done .mono{color:var(--ok)}
.moment{border-left:3px solid var(--pink);padding:4px 0 4px 12px;display:grid;gap:4px}
.moment q{font-size:1.05rem;font-style:italic;quotes:"“" "”"}

/* ingresso */
.ticket{background:var(--dawn);color:var(--ink);border-radius:18px;padding:16px;margin-left:6px;display:grid;gap:10px;min-width:0}
.ticket h3{font-size:clamp(1.3rem,6.4vw,1.7rem);text-transform:uppercase;overflow-wrap:anywhere}
.tk-ev{font-weight:600;color:var(--sea)}
.tk-line{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tk-line li{font-size:.82rem;font-weight:600;background:var(--bg);border-radius:999px;padding:3px 10px}
.tk-note{font-size:.8rem;color:var(--ink-2)}
.wave{display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;min-width:0;border-radius:2px;background:var(--ink);opacity:.22}
.tk-foot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tk-foot div{display:grid;min-width:0}
.tk-foot b{font-family:var(--f-mono);font-weight:500;font-size:.8rem;overflow-wrap:anywhere}
.ticket .btn.ghost{background:var(--bg);border-color:transparent}

/* dia 10 */
.day.sad{background:var(--grey-soft);border-top:0;border-radius:20px;padding:18px 14px;position:relative;overflow:hidden}
.day.sad::after{content:"";position:absolute;inset:-40px;pointer-events:none;opacity:.45;background:repeating-linear-gradient(105deg,transparent 0 17px,var(--grey) 17px 18px,transparent 18px 41px);background-size:140px 140px;animation:rain 1.1s linear infinite;mask-image:linear-gradient(#000,transparent 70%);-webkit-mask-image:linear-gradient(#000,transparent 70%)}
.day.sad>*{position:relative;z-index:1}
.day.sad .dnum{color:var(--grey)}
.day.sad .tl::before{border-color:var(--grey)}
.day.sad .dot{border-color:var(--grey);background:var(--grey)}
.sadline{font-family:var(--f-display);font-weight:500;font-size:1.2rem;line-height:1.2}
.letters{background:var(--bg);border-radius:14px;padding:14px;display:grid;gap:8px}
.letters blockquote{margin:0;padding-left:12px;border-left:3px solid var(--grey)}
@keyframes rain{to{background-position:-38px 140px}}
@media (prefers-reduced-motion: reduce){.day.sad::after{animation:none}}

/* cartões */
.card{background:var(--surface);border-radius:18px;padding:16px;display:grid;gap:10px;min-width:0}
.card h3{font-size:1rem}
.card .note{font-size:.88rem;color:var(--ink-2)}
.card.both{box-shadow:inset 0 0 0 1.5px var(--pink)}
.inout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inout div{display:grid;background:var(--bg);border-radius:12px;padding:8px 10px}
.inout b{font-family:var(--f-mono);font-weight:500}
.inout span:last-child{font-size:.85rem;color:var(--ink-2)}
.copy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.copy .mono{grid-column:1/-1}
.copy p{user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.nights{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px}
.nights i{font-style:normal;font-family:var(--f-mono);font-size:.62rem;text-align:center;padding:9px 0;border-radius:6px;background:var(--sea-light);color:var(--ink)}
.nights i.s1{background:var(--sea);color:var(--on-sea)}
.nights i.s2{background:var(--ok);color:var(--on-sea)}
.nights i.open{background:var(--sun-soft);color:var(--sun-ink);box-shadow:inset 0 0 0 1px var(--sun)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--ink-2)}
.legend u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--sea-light);text-decoration:none}
.legend u.s1{background:var(--sea)}.legend u.s2{background:var(--ok)}.legend u.open{background:var(--sun-soft);box-shadow:inset 0 0 0 1px var(--sun)}
.likes{display:flex;gap:6px;flex-wrap:wrap}
.like{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;display:inline-flex;gap:5px;align-items:center;min-height:36px;color:var(--ink-2)}
.like.on{border-color:var(--pink);color:var(--heart)}
.like.on .ic{fill:var(--heart)}
span.like{background:transparent}
.sched{font-family:var(--f-mono);font-size:.78rem;background:var(--sea-soft);border-radius:6px;padding:3px 8px}
.empty{background:var(--surface);border-radius:18px;padding:22px 16px;text-align:center;color:var(--ink-2);display:grid;gap:6px}
.check{list-style:none;padding:0;display:grid;gap:2px}
.check li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;min-width:0}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--sea);flex:none}
.check .done span{text-decoration:line-through;color:var(--ink-2)}
.x{border:0;background:transparent;color:var(--ink-2);font-size:.8rem;min-height:36px;padding:0 6px}

/* estrada */
.range{position:relative;padding:26px 0 24px}
.range span{position:absolute;font-family:var(--f-mono);font-size:.68rem;white-space:nowrap;transform:translateX(-50%);color:var(--ink-2)}
.range span.t{top:0}.range span.b{bottom:0}
.range span.first{transform:none}.range span.last{transform:none;right:0}
.range-bar{height:12px;border-radius:999px;background:var(--surface-2);position:relative}
.range-bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--sea-light)}
.range-bar .mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink-2)}
.range-bar .car{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--sea);transform:translate(-50%,-50%)}
.legs{list-style:none;padding:0;display:grid}
.legs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.legs li:first-child{border-top:0}
.legs b{font-family:var(--f-mono);font-weight:500;font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.stops{padding-left:18px;display:grid;gap:6px;font-size:.92rem}

/* jogo */
.game{position:relative;width:100%;max-width:360px;margin:0 auto;border-radius:22px;overflow:hidden;background:var(--surface)}
.g-cv{display:block;width:100%;height:auto;aspect-ratio:320/420;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.game,.game button,.tabs a,.chip,.btn,.like{touch-action:manipulation}
.g-ov{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:10px;padding:24px;text-align:center;background:var(--veil)}
.g-ov b{font-family:var(--f-display);font-weight:500;font-size:1.1rem;line-height:1.25}
.g-ov p{font-size:.92rem;color:var(--ink-2);max-width:26ch}

.hero .tag{color:var(--ink-2);font-size:.95rem;margin-top:-8px}
.tracks{list-style:none;padding:0;display:grid}
.tracks li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 8px;padding:12px 0;border-top:1px solid var(--line)}
.tracks li:first-child{border-top:0}
.tn{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2);padding-top:3px}
.tt{display:grid;gap:6px;min-width:0}
.tt>span{font-size:.88rem;color:var(--ink-2);margin-top:-4px}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tabs a{display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:.6rem;font-weight:600;color:var(--ink-2);text-decoration:none}
.tabs a .ic{width:1.35rem;height:1.35rem}
.tabs a[aria-current]{color:var(--sea)}

/* folha */
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;display:grid;gap:14px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h3{font-size:1.05rem;padding-top:6px}
.fld{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.fld input,.fld select,.fld textarea{font-size:16px;font-weight:400;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);width:100%;min-height:44px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%;font-weight:600}
.pick[aria-pressed="true"]{border-color:var(--sea-light);background:var(--sea-soft)}
.picks{display:grid;gap:6px;max-height:38vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:.88rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* base que o claude.ai fornecia */
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{-webkit-tap-highlight-color:transparent}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* versão hospedada */
#player iframe{display:block;width:100%;border:0;border-radius:14px}
.pick img,.tracks .cv{width:40px;height:40px;border-radius:8px;flex:none;object-fit:cover}
.pick div{display:grid;min-width:0}
.pick span{font-weight:400;font-size:.85rem;color:var(--ink-2)}
.tracks li{grid-template-columns:44px minmax(0,1fr)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <span class="brand">B2B de Verão</span>
    <button class="who" id="who" type="button">Quem é você?</button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div id="player" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Seções"><div id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script>
(()=>{'use strict';

  const plain=()=>{if(PL.pid===pid&&!PL.ctl&&!box.querySelector('iframe'))box.replaceChildren(h('iframe',{src:'https://open.spotify.com/embed/playlist/'+pid+'?utm_source=generator',title:'Player do Spotify',height:'152',allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture'}))};
  const make=api=>{if(PL.pid!==pid)return;try{api.createController(holder,{uri:'spotify:playlist:'+pid,width:'100%',height:152},ctl=>{if(PL.pid===pid)PL.ctl=ctl})}catch(e){plain()}};
  if(window.SpIframeApi)make(window.SpIframeApi);
  else{PL.pending=make;
    if(!document.getElementById('sp-iframe-api')){window.onSpotifyIframeApiReady=api=>{window.SpIframeApi=api;if(PL.pending)PL.pending(api)};
      const sc=document.createElement('script');sc.id='sp-iframe-api';sc.async=true;sc.src='https://open.spotify.com/embed/iframe-api/v1';sc.onerror=plain;document.head.append(sc)}}
  setTimeout(plain,6000);
}
function playerPlay(){try{if(PL.ctl)(PL.ctl.resume||PL.ctl.play).call(PL.ctl)}catch(e){}}
function playerPause(){try{if(PL.ctl)PL.ctl.pause()}catch(e){}}

/* ---------- recomendadas: curtir joga a faixa na playlist ---------- */
const RECS=[['Running','Anyma, Meg Myers'],['Eternity','Anyma, Chris Avantgarde'],['Home','Adriatique, Marino Canal, Delhia De France'],['Miracle','Adriatique, WhoMadeWho'],
 ['Beyond Beliefs','Ben Böhmer'],['Breathing','Ben Böhmer, Nils Hoffmann, Malou'],['Boavista','Stephan Bodzin'],['Innerbloom','RÜFÜS DU SOL'],['On My Knees','RÜFÜS DU SOL'],['Next to Me','RÜFÜS DU SOL'],
 ['Grey','Kölsch'],['The Feeling','Massano'],['Aria','Argy, Omnya'],['Oxygen Levels Low','Colyn'],['Concorde','Miss Monique'],['Weak','Vintage Culture, Maxi Jazz'],
 ['Drive','Black Coffee, David Guetta, Delilah Montagu'],['Move','Adam Port, Stryv, Malachiii'],['The Rapture Pt.III','&ME, Black Coffee, Keinemusik'],['Desire','Bob Moses, ZHU'],
 ['Brightest Lights','Lane 8, POLIÇA'],['The One You Left Behind','Yotto, Vök'],['Rabbit Hole','CamelPhat, Jem Cooke'],['For a Feeling','CamelPhat, ARTBAT, RHODES'],
 ['The Space In Between','Jan Blomqvist'],['Burning Sun','Monolink'],['Flame','ARTBAT'],['Flashdance','Deep Dish'],['Night After Night','Fideles'],['Never Give Up','Mathame'],["You're So High",'Eli & Fur'],['Dance With Me','Kevin de Vries']
].map(r=>({title:r[0],artist:r[1],key:(r[0]+'-'+r[1].split(',')[0]).toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-')}));
const recList=()=>S.recX.concat(RECS).filter(r=>!S.recsHidden[r.key]&&!S.tracks.some(t=>t.rec===r.key||(r.uri&&t.uri===r.uri)));
const hideRec=r=>write(db=>upsert(db,'meta/recs',{hidden:{[r.key]:true}}));
async function likeRec(r,btn){
  if(btn)btn.disabled=true;
  let f=r.uri?r:null;if(!f&&spOn()){try{f=await spFind(r.title,r.artist)}catch(e){}}
  if(f&&S.tracks.some(t=>t.uri===f.uri)){toast('Essa faixa já está na playlist.');hideRec(r);return}
  const doc={title:f?f.title:r.title,artist:f?f.artist:r.artist,uri:f?f.uri:'',link:f?f.link:'',cover:f?f.cover:'',rec:r.key,likes:S.who?{[S.who]:true}:{},order:Date.now()};
  if(await write(db=>db.collection('tracks').add(doc),'Entrou na playlist'))setTimeout(()=>spSync(true),700);else if(btn)btn.disabled=false;
}
async function moreRecs(btn){
  if(btn)btn.disabled=true;
  const pool=Array.from(new Set(S.tracks.concat(RECS).map(t=>String(t.artist||'').split(',')[0].trim()).filter(Boolean))),picks=[];
  while(picks.length<2&&pool.length)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  let got=[];
  try{for(const a of picks){const r=await spApi('/search?type=track&limit=10&q='+encodeURIComponent('artist:"'+a+'"'));
      got=got.concat(((r&&r.tracks&&r.tracks.items)||[]).filter(Boolean).map(it=>Object.assign(fromSp(it),{key:'sp-'+it.id})).filter(x=>!S.recsHidden[x.key]&&!S.tracks.some(t=>t.uri===x.uri)&&!S.recX.some(y=>y.uri===x.uri)).slice(0,4))}}
  catch(e){toast(e&&e.code==='no_auth'?'Conecte o Spotify de novo.':'O Spotify não respondeu. Tente de novo.')}
  if(got.length){S.recX=got.concat(S.recX).slice(0,40);S.recPage=0;toast(got.length+' sugestões novas de '+picks.join(' e '))}
  render();
}
function recsView(){
  const all=recList(),size=5,pages=Math.max(1,Math.ceil(all.length/size)),pg=S.recPage%pages,list=all.slice(pg*size,pg*size+size);
  return[h('div',{class:'vh'},h('h2',{},'Recomendadas'),h('p',{},'Curtiu, entrou na playlist. O X tira a sugestão da lista dos dois.')),
    list.length?h('ul',{class:'tracks'},list.map(r=>h('li',{},
      safeUrl(r.cover)?h('img',{class:'cv',src:r.cover,alt:'',width:'40',height:'40',loading:'lazy'}):h('span',{class:'tn'},'♪'),
      h('div',{class:'tt'},h('b',{},r.title),h('span',{},r.artist),
        h('div',{class:'row'},(()=>{const b=h('button',{class:'like',type:'button',onclick:()=>likeRec(r,b)},icon('heart'),'Curtir');return b})(),
          ext(r.link&&safeUrl(r.link)?r.link:spSearch(r.title+' '+r.artist),'Ouvir'),h('button',{class:'x',type:'button','aria-label':'Tirar sugestão',onclick:()=>hideRec(r)},'✕')))))):h('div',{class:'empty'},h('b',{},'Acabaram as sugestões'),h('p',{},spOn()?'Peçam mais ao Spotify no botão abaixo.':'Conectem o Spotify para trazer mais.')),
    h('div',{class:'row'},pages>1?h('button',{class:'btn ghost small',type:'button',onclick:()=>{S.recPage=pg+1;render()}},'Ver outras'):null,
      spOn()?(()=>{const b=h('button',{class:'btn ghost small',type:'button',onclick:()=>moreRecs(b)},'Trazer mais do Spotify');return b})():null)];
}

/* ---------- playlist ---------- */
function manualTrackSheet(){
  const t=inp('f-title','text','',{maxlength:'80',placeholder:'Nome da música'}),a=inp('f-artist','text','',{maxlength:'80',placeholder:'Artista'}),l=inp('f-link','url','',{placeholder:'https://open.spotify.com/track/...'});
  openSheet('Nova faixa',[h('p',{class:'note'},'Sem link, o botão Ouvir abre a busca do Spotify com o nome. Faixas adicionadas assim não vão sozinhas para a playlist do Spotify.'),
    fld('f-title','Música',t),fld('f-artist','Artista',a),fld('f-link','Link do Spotify (opcional)',l),
    h('button',{class:'btn',type:'button',onclick:async()=>{const title=t.value.trim();if(!title){toast('Escreva o nome da música.');return}
      if(l.value.trim()&&!safeUrl(l.value.trim())){toast('O link precisa começar com https://');return}
      const m=/track[\/:]([A-Za-z0-9]{10,})/.exec(l.value);
      if(await write(db=>db.collection('tracks').add({title,artist:a.value.trim(),link:l.value.trim(),uri:m?'spotify:track:'+m[1]:'',likes:{},order:Date.now()}),'Faixa na playlist')){closeSheet();setTimeout(()=>spSync(true),700)}}},'Adicionar')]);
}
function trackSheet(){
  if(!spOn())return manualTrackSheet();
  const q=inp('f-q','search','',{placeholder:'Música ou artista',autocomplete:'off'}),out=h('div',{class:'picks'});let tm=0,seq=0;
  const add=async tr=>{
    if(S.tracks.some(t=>t.uri===tr.uri)){toast('Essa faixa já está na playlist.');return}
    const img=((tr.album&&tr.album.images)||[]).slice(-1)[0];
    if(await write(db=>db.collection('tracks').add({title:String(tr.name||''),artist:(tr.artists||[]).map(a=>a.name).join(', '),uri:tr.uri,link:(tr.external_urls&&tr.external_urls.spotify)||'',cover:img?img.url:'',likes:{},order:Date.now()}),'Faixa na playlist')){closeSheet();setTimeout(()=>spSync(true),700)}};
  const run=async()=>{const term=q.value.trim(),my=++seq;if(term.length<2){out.replaceChildren();return}
    try{const r=await spApi('/search?type=track&limit=10&q='+encodeURIComponent(term));if(my!==seq)return;
      const items=((r&&r.tracks&&r.tracks.items)||[]).filter(Boolean);
      out.replaceChildren(...(items.length?items.map(tr=>{const img=((tr.album&&tr.album.images)||[]).slice(-1)[0];
        return h('button',{class:'pick',type:'button',onclick:()=>add(tr)},img&&safeUrl(img.url)?h('img',{src:img.url,alt:'',width:'40',height:'40'}):null,h('div',{},h('b',{},tr.name),h('span',{},(tr.artists||[]).map(a=>a.name).join(', '))))}):[h('p',{class:'note'},'Nada encontrado.')]))}
    catch(e){if(my===seq)out.replaceChildren(h('p',{class:'note'},e&&e.code==='no_auth'?'A conexão com o Spotify expirou. Conecte de novo na tela da playlist.':'A busca falhou. Tente de novo.'))}};
  q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,350)});
  openSheet('Adicionar faixa',[fld('f-q','Buscar no Spotify',q),out,h('div',{class:'row'},h('button',{class:'btn ghost small',type:'button',onclick:manualTrackSheet},'Adicionar sem buscar'))]);
  q.focus();
}
function playlistSheet(){
  const l=inp('f-link','url',S.playlist,{placeholder:'https://open.spotify.com/playlist/...'});
  openSheet('Playlist no Spotify',[h('p',{class:'note'},'Colem o link de uma playlist de vocês. O player e o envio das faixas passam a usar essa playlist.'),fld('f-link','Link da playlist',l),
    h('button',{class:'btn',type:'button',onclick:async()=>{const v=l.value.trim();if(v&&!safeUrl(v)){toast('O link precisa começar com https://');return}
      const m=/playlist[\/:]([A-Za-z0-9]{10,})/.exec(v);if(v&&!m){toast('Esse link não parece ser de uma playlist do Spotify.');return}
      if(await write(db=>upsert(db,'meta/playlist',{url:v,id:m?m[1]:''}),v?'Link salvo':'Link removido')){SP.noWrite=false;closeSheet()}}},'Salvar')]);
}
async function dropTrack(t){
  if(!(await write(db=>db.doc('tracks/'+t.id).delete(),'Faixa removida')))return;
  if(t.sp&&t.uri&&S.playlistId&&spOn())spApi('/playlists/'+S.playlistId+'/items',{method:'DELETE',body:{items:[{uri:t.uri}]}}).catch(()=>{});
}
function playlistView(){
  const list=S.tracks.slice().sort(byOrder),url=safeUrl(S.playlist),on=spOn(),cfg=!!CFG.spotifyClientId,pend=list.filter(t=>t.uri&&!t.sp).length;
  const B=(label,fn,cls)=>h('button',{class:cls||'btn ghost small',type:'button',onclick:fn},label);
  return[h('div',{class:'card'},h('h3',{},'Nossa playlist'),
      h('p',{class:'note'},!cfg?'O Spotify ainda não foi configurado neste site. Por enquanto as faixas abrem por link.':on?'Spotify conectado neste aparelho. A busca e o envio das faixas usam a sua conta.':'Conecte o Spotify para buscar músicas aqui e mandar as faixas direto para a playlist de vocês.'),
      h('div',{class:'row'},cfg&&!on?B('Conectar Spotify',spLogin,'btn small'):null,
        on&&S.playlistId&&pend&&!SP.noWrite?B(pend===1?'Enviar 1 faixa para o Spotify':'Enviar '+pend+' faixas para o Spotify',()=>spSync(),'btn small'):null,
        url?ext(url,'Abrir no Spotify'):null,on&&!S.playlistId?B('Criar playlist no Spotify',spCreate,'btn small'):null,
        B(url?'Trocar playlist':'Colar link de uma playlist',playlistSheet),on?B('Desconectar',spLogout):null)),
    h('button',{class:'btn dashed',type:'button',onclick:trackSheet},icon('plus'),on?'Buscar e adicionar faixa':'Adicionar faixa'),
    list.length?h('ul',{class:'tracks'},list.map((t,i)=>h('li',{},
      safeUrl(t.cover)?h('img',{class:'cv',src:t.cover,alt:'',width:'40',height:'40',loading:'lazy'}):h('span',{class:'tn'},p2(i+1)),
      h('div',{class:'tt'},h('b',{},t.title),t.artist&&h('span',{},t.artist+(t.sp?' · no Spotify':'')),
        h('div',{class:'row'},likes('tracks',t),ext(trackUrl(t),'Ouvir'),confirmBtn('Tirar',()=>dropTrack(t))))))):(loadingNote('As faixas')||h('div',{class:'empty'},h('b',{},'Playlist vazia'),h('p',{},'Adicionem a primeira faixa ou curtam uma recomendada.'))),
    ...(S.db?recsView():[])];
}

/* ---------- render ---------- */
let raf=0;const soon=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})};
function render(){
  const map={dias:viewDias,reservas:viewReservas,ideias:viewIdeias,decidir:viewDecidir,estrada:viewEstrada,jogo:viewJogo,playlist:viewPlaylist};
  $('#view').replaceChildren(...(map[S.tab]||viewDias)().filter(Boolean));
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.getAttribute('href')==='#'+S.tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const w=$('#who');w.replaceChildren(icon('user'),S.who?pname(S.who):'Quem é você?');
  const b=$('#banner'),msg=S.dbState==='absent'?'Este site ainda não foi ligado ao banco de dados.':S.dbState==='lost'?'Sem conexão com os dados da viagem. Tentando de novo…':S.readOnly?'Não foi possível salvar com esse código.':'';
  if(S.dbState==='locked'){b.hidden=false;b.replaceChildren('Entre com o código da viagem para ver reservas, ideias e playlist. ',h('button',{class:'btn small',type:'button',onclick:codeSheet},'Digitar código'))}
  else{b.hidden=!msg;b.textContent=msg}
  const pl=$('#player'),pid=S.playlistId;
  playerMount(pid);
  pl.hidden=!(pid&&(S.tab==='playlist'||(S.tab==='jogo'&&S.audio==='playlist')));
  tick();
}
$('#tabs').replaceChildren(...TABS.map(t=>h('a',{href:'#'+t[0]},icon(t[2]),t[1])));
$('#who').addEventListener('click',whoSheet);
function route(first){const t=location.hash.slice(1);const ok=TABS.some(x=>x[0]===t);const next=ok?t:'dias';if(next!==S.tab||first){S.tab=next;render();if(!first)window.scrollTo(0,0)}}
window.addEventListener('hashchange',()=>route(false));
setInterval(tick,1000);

async function connect(code){
  const db=makeDb(code);let n;S.dbState='loading';render();
  try{n=await db.pull()}catch(e){S.dbState='lost';render();return false}
  if(!n){S.dbState='locked';render();return false}
  LS.set('trip',code);S.db=db;S.dbState='ready';S.readOnly=false;
  const rows=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
  db.collection('ideas').onSnapshot(s=>{S.ideas=rows(s);soon()});
  db.collection('options').onSnapshot(s=>{S.options=rows(s);soon()});
  db.collection('checklist').onSnapshot(s=>{S.checklist=rows(s);soon()});
  db.collection('stays').onSnapshot(s=>{S.stays=rows(s);soon()});
  db.collection('recados').onSnapshot(s=>{S.recados=rows(s);soon()});
  db.collection('tracks').onSnapshot(s=>{S.tracks=rows(s);soon()});
  db.collection('days').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});S.days=m;soon()});
  db.doc('meta/people').onSnapshot(s=>{const d=s.exists?s.data():{};S.people={a:String(d.a||''),b:String(d.b||'')};soon()});
  db.doc('meta/decisions').onSnapshot(s=>{S.decisions=s.exists?Object.assign({},s.data()):{};soon()});
  db.doc('meta/recs').onSnapshot(s=>{S.recsHidden=(s.exists&&s.data().hidden)||{};soon()});
  db.doc('meta/scores').onSnapshot(s=>{S.scores=s.exists?Object.assign({},s.data()):{};soon()});
  db.doc('meta/playlist').onSnapshot(s=>{const d=s.exists?s.data():{},u=String(d.url||''),m=/playlist[\/:]([A-Za-z0-9]{10,})/.exec(u);S.playlist=u;S.playlistId=String(d.id||'')||(m?m[1]:'');soon()});
  db.start();render();setTimeout(()=>spSync(true),1500);return true;
}
async function boot(){
  const q=new URLSearchParams(location.search),k=q.get('k'),back=await spHandleRedirect(q);
  if(k||q.get('code')||q.get('error'))history.replaceState(null,'',location.pathname+(back?'#playlist':location.hash));
  route(true);
  const today=todayBRT();if(S.tab==='dias'&&today>START&&today<=END){const el=document.getElementById('d-'+today);if(el)el.scrollIntoView({block:'start'})}
  if(!CFG.supabaseUrl||!CFG.supabaseKey){S.dbState='absent';render();return}
  const code=k||LS.get('trip');if(!code){S.dbState='locked';render();return}
  await connect(code);
}
boot();
})();
